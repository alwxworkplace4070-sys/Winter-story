<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новогодние сказки</title>
    <link rel="stylesheet" href="/Winter-story/css/main.css">
</head>

<script>
    function createSnowflakes() {
        const snowflakesCount = 50;
        const wrapper = document.querySelector('.wrapper');
        
        for (let i = 0; i < snowflakesCount; i++) {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            snowflake.innerHTML = '❄️';
            
            const size = Math.random() * 1.5 + 0.5;
            const left = Math.random() * 100;
            const duration = Math.random() * 5 + 5;
            const delay = Math.random() * 5;
            
            snowflake.style.left = left + '%';
            snowflake.style.fontSize = size + 'em';
            snowflake.style.animationDuration = duration + 's';
            snowflake.style.animationDelay = delay + 's';
            snowflake.style.opacity = Math.random() * 0.7 + 0.3;
            
            wrapper.appendChild(snowflake);
        }
    }
    
    window.addEventListener('load', createSnowflakes);
</script>

<body>
    <div class="wrapper">    
        <div class="korpus-image">
            <img src="/Winter-story/img/корус.svg" alt="Корус">
        </div>

        <header class="container"> 
            <nav>
                <ul>
                    <li class="active"><a href="/Winter-story/">Главная</a></li>
                    <li><a href="/Winter-story/about.html">Сказки</a></li>
                    <li><a href="/Winter-story/autor.html">О нас</a></li>
                </ul>
            </nav>
        </header>

        <div class="hero container">
            <div class="hero--info">
                <h1>Новогодние<br>сказки</h1>
            </div>
            
            <img src="/Winter-story/img/tree2.svg" alt="Новогодняя елка" class="hero-image">
        </div>

        <div class="text-block">
            <p>Нет сказок лучше тех,<br>которые создаются<br>в любимом корпусе!</p>
        </div>
    </div>
</body>

</html>
