<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новогодние сказки</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<!-- Снежинки -->
<script>
    function createSnowflakes() {
        const snowflakesCount = 50; // Количество снежинок
        const wrapper = document.querySelector('.wrapper');
        
        for (let i = 0; i < snowflakesCount; i++) {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            snowflake.innerHTML = '❄️';
            
            // Случайные параметры для каждой снежинки
            const size = Math.random() * 1.5 + 0.5; // Размер от 0.5em до 2em
            const left = Math.random() * 100; // Позиция слева от 0% до 100%
            const duration = Math.random() * 5 + 5; // Длительность от 5s до 10s
            const delay = Math.random() * 5; // Задержка от 0s до 5s
            
            // Применяем стили
            snowflake.style.left = left + '%';
            snowflake.style.fontSize = size + 'em';
            snowflake.style.animationDuration = duration + 's';
            snowflake.style.animationDelay = delay + 's';
            snowflake.style.opacity = Math.random() * 0.7 + 0.3;
            
            wrapper.appendChild(snowflake);
        }
    }
    
    // Запускаем создание снежинок после загрузки страницы
    window.addEventListener('load', createSnowflakes);
</script>
<body>
    <div class="wrapper">    
        <!-- Изображение корус.svg выносим отдельно, вне header -->
        <div class="korpus-image">
            <img src="img/корус.svg" alt="Корус">
        </div>

        <header class="container"> 
            <nav>
                <ul>
                    <li ><a href="/">Главная</a></li>
                    <li class="active"><a href="/about.html">Сказки</a></li>
                    <li><a href="/autor.html">О нас</a></li>
                </ul>
            </nav>
        </header>

        <div class="hero container">
            <div class="hero--info">
                <h1>Новогодние<br>сказки</h1>
            </div>
            
            <img src="img/tree2.svg" alt="Новогодняя елка" class="hero-image">
        </div>

        <!-- Текстовый блок выносим отдельно -->
        <div class="text-block">
            <p>Нет сказок лучше тех,<br>которые создаются<br>в любимом корпусе!</p>
        </div>
    </div>
</body>

</html>
