<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создатели чуда</title>
    <link rel="stylesheet" href="/Winter-story/css/main.css">
    <style>
        .flip-card {
            background-color: transparent;
            width: 300px;
            height: 400px;
            perspective: 1000px;
            margin: 20px;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flip-card:hover .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .flip-card-front {
            background-color: #f8f9fa;
            color: #333;
            transform: rotateY(0deg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .flip-card-back {
            background-color: #ddd;
            transform: rotateY(180deg);
        }

        .back-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
        }

        .card-content {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            width: 100%;
            height: 100%;
        }

        .creator-role {
            text-align: center;
            margin: 0;
            line-height: 1.4;
            flex-shrink: 0;
            font-size: 16px;
        }

        .front-qr-image {
            max-width: 80px;
            margin: 10px auto;
            display: block;
            border: 3px solid gold;
            border-radius: 12px;
            padding: 5px;
            background-color: #fff9c4;
            flex-shrink: 0;
        }

        .creator-name {
            text-align: center;
            margin: 0;
            margin-top: auto;
            padding-bottom: 10px;
            font-size: 24px;
        }

        .creators-grid {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 40px;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="container">
            <header>
                <nav>
                    <ul>
                        <li><a href="/Winter-story/">Главная</a></li>
                        <li><a href="/Winter-story/about.html">Сказки</a></li>
                        <li class="active"><a href="/Winter-story/autor.html">О нас</a></li>
                    </ul>
                </nav>
            </header>

            <h1 class="title">Создатели чуда</h1>

            <div class="creators-grid">
                <div class="flip-card first-card">
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <div class="card-content">
                                <p class="creator-role">Учитель физики, автор сказок и опора всего творчества.</p>
                                <h2 class="creator-name">Киселева Наталия Юрьевна</h2>
                            </div>
                        </div>
                        <div class="flip-card-back">
                            <img src="/Winter-story/img/НЮ.svg" alt="Наталья Юрьевна" class="back-image">
                        </div>
                    </div>
                </div>

                <div class="flip-card second-card">
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <div class="card-content">
                                <p class="creator-role">Огромное спасибо нашим актерам за их вклад!<br>имена и роли</p>
                                <img src="/Winter-story/img/QR.svg" alt="QR код" class="front-qr-image">
                                <h2 class="creator-name">Актеры сказки 2024г</h2>
                            </div>
                        </div>
                        <div class="flip-card-back">
                            <img src="/Winter-story/img/ЮР.svg" alt="Актеры" class="back-image">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
